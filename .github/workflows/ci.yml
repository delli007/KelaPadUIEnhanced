name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3

      - name: Static audit
        run: python _tools/audit_addon.py

      - name: Build add-on zip
        run: python _tools/package_addon.py --notes dist/notes.md

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: addon-zip
          path: dist/*.zip
          if-no-files-found: error
